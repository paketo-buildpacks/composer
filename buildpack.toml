api = "0.7"

[buildpack]
  description = "A buildpack for installing Composer, a dependency manager for PHP"
  homepage = "https://github.com/paketo-buildpacks/composer"
  id = "paketo-buildpacks/composer"
  keywords = ["php", "composer"]
  name = "Paketo Buildpack for Composer"
  sbom-formats = ["application/vnd.cyclonedx+json", "application/spdx+json", "application/vnd.syft+json"]

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/composer/blob/main/LICENSE"

[metadata]
  include-files = ["linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "buildpack.toml"]
  pre-package = "./scripts/build.sh --target linux/amd64 --target linux/arm64"
  [metadata.default-versions]
    composer = "*"

  [[metadata.dependencies]]
    checksum = "sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c"
    cpe = "cpe:2.3:a:getcomposer:composer:2.11.1:*:*:*:*:python:*:*"
    id = "composer"
    licenses = ["MIT"]
    name = "composer"
    purl = "pkg:generic/composer@2.11.1?checksum=6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c&download_url=https://getcomposer.org/download/2.11.1/composer.phar"
    source = "https://getcomposer.org/download/2.11.1/composer.phar"
    source-checksum = "sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c"
    stacks = ["*"]
    uri = "https://getcomposer.org/download/2.11.1/composer.phar"
    version = "2.11.1"

  [[metadata.dependencies]]
    checksum = "sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028"
    cpe = "cpe:2.3:a:getcomposer:composer:2.11.2:*:*:*:*:python:*:*"
    id = "composer"
    licenses = ["MIT"]
    name = "composer"
    purl = "pkg:generic/composer@2.11.2?checksum=dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028&download_url=https://getcomposer.org/download/2.11.2/composer.phar"
    source = "https://getcomposer.org/download/2.11.2/composer.phar"
    source-checksum = "sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028"
    stacks = ["*"]
    uri = "https://getcomposer.org/download/2.11.2/composer.phar"
    version = "2.11.2"

  [[metadata.dependency-constraints]]
    constraint = "2.*"
    id = "composer"
    patches = 2

[[stacks]]
  id = "io.buildpacks.stacks.jammy"

[[stacks]]
  id = "io.buildpacks.stacks.noble"

[[stacks]]
  id = "io.buildpacks.stacks.resolute"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
